<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KiNG DESiGN · 订单详情</title>
<style>
  :root{
    --ink:#1c1917;--ink-2:#57534e;--ink-3:#a8a29e;--bg:#fafaf9;--surface:#fff;--line:#eae8e4;--line-2:#e2e0dc;
    --err:#e02424;--ok:#16a34a;--amber:#f59e0b;--blue:#2563eb;
    --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:18px;
    --font:"PingFang SC","Helvetica Neue",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 40px;position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:14px}.brand .logo{font-weight:800;font-size:19px}
  .brand .sep{width:1px;height:18px;background:var(--line-2)}.brand .sub{color:var(--ink-2);font-size:14px}
  .top-right{display:flex;align-items:center;gap:14px}
  .role-toggle{display:flex;background:#f2f0ed;border-radius:999px;padding:3px}
  .role-toggle button{border:none;background:none;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
  .role-toggle button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
  .test-badge{display:inline-flex;align-items:center;gap:7px;background:#fffdf5;border:1px solid #fde9b0;color:#b45309;
    font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 12px;border-radius:999px}
  .test-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .layout{max-width:1160px;margin:0 auto;padding:36px 40px 72px;display:grid;grid-template-columns:1.35fr 1fr;gap:32px;align-items:start}
  .back{display:inline-flex;gap:8px;color:var(--ink-2);font-size:14px;text-decoration:none;margin-bottom:18px;cursor:pointer}
  h1{font-size:30px;font-weight:800;margin:0 0 6px}
  .lead{color:var(--ink-2);font-size:15px;margin:0 0 24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px 24px}
  .card + .card{margin-top:18px}
  .order{display:flex;gap:18px;align-items:center}
  .order .thumb{width:88px;height:88px;border-radius:var(--r-md);flex:none;background:linear-gradient(135deg,#efe9df,#e6ded0);border:1px solid var(--line)}
  .order h3{margin:0 0 8px;font-size:17px}.order .meta{font-size:13px;color:var(--ink-2);line-height:1.9}
  .order .meta b{color:var(--ink);font-weight:500}
  .chip{display:inline-block;margin-top:8px;font-size:12px;padding:3px 10px;border-radius:var(--r-sm);background:#f5f4f2;border:1px solid var(--line-2);color:var(--ink-2)}
  /* 状态时间线 */
  .steps{display:flex;gap:0;margin:4px 0 2px}
  .step{flex:1;text-align:center;position:relative}
  .step .dot{width:26px;height:26px;border-radius:50%;background:#eceae6;color:var(--ink-3);display:grid;place-items:center;margin:0 auto 8px;font-size:13px;font-weight:700;position:relative;z-index:1}
  .step.done .dot{background:var(--ink);color:#fff}.step.active .dot{background:var(--blue);color:#fff}
  .step .t{font-size:12px;color:var(--ink-2)}.step.active .t{color:var(--ink);font-weight:600}
  .step:not(:last-child):after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:#eceae6;z-index:0}
  .step.done:not(:last-child):after{background:var(--ink)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .stat{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
  .stat .k{font-size:12px;color:var(--ink-3)}.stat .v{font-size:14px;font-weight:600;margin-top:3px}
  /* 主按钮 */
  .primary{width:100%;padding:15px;border:none;border-radius:var(--r-md);background:var(--ink);color:#fff;font-size:15px;font-weight:500;cursor:pointer;margin-top:20px}
  .primary:hover{background:#000}.primary:disabled{background:#d6d3d1;color:#fff;cursor:not-allowed}
  .primary.wait{background:#faf9f8;color:var(--ink-3);border:1.5px dashed var(--line-2)}
  /* 右栏面板 */
  .pt{font-size:15px;font-weight:600;margin:0 0 14px}
  .field{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
  .field .v{color:var(--ink);font-weight:500}
  .lnk{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:14px;text-decoration:none;cursor:pointer;margin-top:14px}
  .drop{border:1.5px dashed var(--line-2);border-radius:var(--r-md);padding:22px;text-align:center;cursor:pointer;margin-top:12px}
  .drop:hover{border-color:var(--ink-3);background:#fafaf9}.drop .up{font-size:20px;color:var(--ink-2)}.drop .t{font-size:14px;margin:6px 0 3px}.drop .h{font-size:12px;color:var(--ink-3)}
  .btn{padding:11px 16px;border:none;border-radius:var(--r-md);font-size:14px;cursor:pointer}
  .btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#000}
  .btn-line{background:#fff;border:1.5px solid var(--line-2);color:var(--ink)}.btn-line:hover{border-color:var(--ink)}
  .btn-ok{background:var(--ok);color:#fff}.btn-err{background:#fff;border:1.5px solid #f3c0c0;color:var(--err)}
  .btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  /* 锁定花型预览 */
  .locks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .lockcell{position:relative;aspect-ratio:1;border-radius:var(--r-md);overflow:hidden;background:linear-gradient(135deg,#efe9df,#e6ded0);border:1px solid var(--line)}
  .lockcell .ov{position:absolute;inset:0;background:rgba(20,18,16,.5);display:grid;place-items:center;color:#fff;text-align:center}
  .lockcell .ov .l{font-size:20px}.lockcell .ov .tx{font-size:11px;margin-top:3px}
  .delivery-file{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-top:10px}
  .delivery-file .n{font-size:14px;font-weight:500}.delivery-file .s{font-size:12px;color:var(--ink-3)}
  .note{font-size:13px;color:var(--ink-2);margin-top:12px;line-height:1.6}
  .hintbox{background:#f6f5f3;border-radius:var(--r-md);padding:12px 14px;font-size:13px;color:var(--ink-2);margin-top:8px}
  @media(max-width:880px){.layout{grid-template-columns:1fr;padding:24px 18px 60px}.topbar{padding:0 18px}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo">KiNG DESiGN</span><span class="sep"></span><span class="sub">订单详情</span></div>
    <div class="top-right">
      <div class="role-toggle" id="roleToggle">
        <button data-role="customer" class="on">客户视角</button>
        <button data-role="staff">员工视角</button>
      </div>
      <span class="test-badge"><span class="dot"></span>TEST MODE</span>
    </div>
  </div>

  <div class="layout">
    <div class="left">
      <a class="back">← 返回订单列表</a>
      <h1>订单 DD-20260726-0007</h1>
      <p class="lead" id="lead">跟踪签约、支付与交付进度。</p>

      <div class="card order">
        <div class="thumb"></div>
        <div>
          <h3>缠枝莲团花 等 2 款</h3>
          <div class="meta">订单编号　<b>DD-20260726-0007</b><br>授权类型　<b>非独家 / 独家</b><br>应付金额　<b>¥1,000.00</b></div>
          <span class="chip" id="orderStatusChip">待签约</span>
        </div>
      </div>

      <div class="card">
        <div class="steps" id="steps"></div>
        <div class="statgrid">
          <div class="stat"><div class="k">签约状态</div><div class="v" id="sAgr">—</div></div>
          <div class="stat"><div class="k">支付状态</div><div class="v" id="sPay">—</div></div>
          <div class="stat"><div class="k">交付状态</div><div class="v" id="sDel">—</div></div>
          <div class="stat"><div class="k">订单状态</div><div class="v" id="sOrd">—</div></div>
        </div>
        <button class="primary" id="primaryBtn"></button>
      </div>
    </div>

    <div class="right"><div class="card" id="panel"></div></div>
  </div>

<script>
// ====== 与后端 lifecycle.js 一致的标签与主按钮状态机（前端镜像；后端为权威） ======
const LABELS={
  order:{draft:"草稿",pending_confirmation:"待确认",pending_signing:"待签约",active:"进行中",completed:"已完成",cancelled:"已取消",expired:"已过期",archived:"已归档"},
  payment:{unpaid:"未支付",processing:"支付处理中",pending_manual_verification:"待财务确认",paid:"已支付",partially_refunded:"部分退款",refunding:"退款中",refunded:"已退款",failed:"支付失败",expired:"已过期"},
  delivery:{not_ready:"未准备",preparing:"准备中",prepared_locked:"已准备待付款",ready:"可下载",downloaded:"已下载",frozen:"已冻结",revoked:"已撤回"},
  agreement:{no_agreement:"未上传协议",agreement_uploaded:"协议已上传",awaiting_signature:"待客户签署",signed_returned:"客户已回传",reviewing:"审核中",rejected:"审核驳回",signed:"已签署"},
};
function resolvePrimaryButton(o){
  const {order_status,agreement_status,payment_status,delivery_status}=o;
  if(order_status==="cancelled")return{label:"订单已取消",action:null,disabled:true};
  if(order_status==="completed"||order_status==="archived")return{label:"查看订单记录",action:"record",disabled:false};
  if(agreement_status!=="signed"){
    if(agreement_status==="rejected")return{label:"重新上传签署文件",action:"sign",disabled:false};
    if(agreement_status==="signed_returned"||agreement_status==="reviewing")return{label:"签署文件审核中",action:null,disabled:true};
    return{label:"查看并签署",action:"sign",disabled:false};
  }
  if(["unpaid","failed","expired"].includes(payment_status))return{label:"立即支付",action:"pay",disabled:false};
  if(["processing","pending_manual_verification"].includes(payment_status))return{label:"正在确认支付",action:null,disabled:true};
  if(["refunding","refunded","partially_refunded"].includes(payment_status))return{label:"查看订单记录",action:"record",disabled:false};
  if(payment_status==="paid"){
    if(["not_ready","preparing","prepared_locked"].includes(delivery_status))return{label:"等待交付",action:null,disabled:true};
    if(delivery_status==="ready")return{label:"查看交付文件",action:"delivery",disabled:false};
    if(delivery_status==="downloaded")return{label:"下载交付文件",action:"delivery",disabled:false};
  }
  return{label:"查看订单",action:"record",disabled:false};
}

// ====== 内存订单状态（TEST：模拟后端权威结果）======
let O={order_status:"pending_signing",agreement_status:"no_agreement",payment_status:"unpaid",delivery_status:"not_ready"};
let role="customer";

function stageIndex(){
  if(O.agreement_status!=="signed")return 0;
  if(O.payment_status!=="paid")return 1;
  if(!["ready","downloaded"].includes(O.delivery_status))return 1;
  if(O.order_status==="completed")return 3; return 2;
}
function render(){
  // 时间线
  const stages=["签约","支付","交付","完成"];const idx=stageIndex();
  document.getElementById("steps").innerHTML=stages.map((s,i)=>
    `<div class="step ${i<idx?'done':i===idx?'active':''}"><div class="dot">${i<idx?'✓':i+1}</div><div class="t">${s}</div></div>`).join("");
  document.getElementById("sAgr").textContent=LABELS.agreement[O.agreement_status];
  document.getElementById("sPay").textContent=LABELS.payment[O.payment_status];
  document.getElementById("sDel").textContent=LABELS.delivery[O.delivery_status];
  document.getElementById("sOrd").textContent=LABELS.order[O.order_status];
  document.getElementById("orderStatusChip").textContent=LABELS.order[O.order_status];
  // 主按钮（客户视角）
  const pb=document.getElementById("primaryBtn");const b=resolvePrimaryButton(O);
  pb.textContent=b.label;pb.disabled=b.disabled;pb.className="primary"+(b.disabled?" wait":"");
  pb.style.display=role==="customer"?"block":"none";
  pb.onclick=()=>onPrimary(b.action);
  renderPanel();
}

function onPrimary(action){
  if(action==="sign")showCustomerSign();
  else if(action==="pay"){location.href="./pay.html";}
  else if(action==="delivery")showDelivery();
  else if(action==="record")showRecord();
}

// ====== 右栏面板：随角色+阶段变化 ======
function renderPanel(){
  const p=document.getElementById("panel");
  if(role==="staff")return renderStaff(p);
  // 客户视角
  if(O.agreement_status!=="signed")return showCustomerSign(p);
  if(O.payment_status!=="paid")return p.innerHTML=`<div class="pt">待支付</div><div class="hintbox">合同已生效，请完成付款以解锁正式交付文件。</div><a class="lnk" href="./pay.html">前往支付页 →</a>`;
  return showDelivery(p);
}

function showCustomerSign(p){
  p=p||document.getElementById("panel");
  if(O.agreement_status==="no_agreement"){p.innerHTML=`<div class="pt">等待协议</div><div class="hintbox">销售正在准备合同/协议，请稍候。</div>`;return;}
  if(O.agreement_status==="reviewing"||O.agreement_status==="signed_returned"){
    p.innerHTML=`<div class="pt">签署文件审核中</div><div class="hintbox">您已回传签署文件，我们正在内部审核，通过后即可进入支付。</div>`;return;}
  const rejected=O.agreement_status==="rejected";
  p.innerHTML=`<div class="pt">${rejected?"签署文件需重新提交":"查看并签署"}</div>
    ${rejected?`<div class="hintbox" style="color:var(--err)">驳回原因：缺少盖章，请重新上传。</div>`:""}
    <div class="field"><span>协议文件</span><span class="v">KiNG_授权协议.pdf</span></div>
    <a class="lnk" onclick="alert('TEST：下载协议（占位）')">↓ 下载协议（PDF/Word）</a>
    <div class="drop" onclick="doSubmitSigned()"><div class="up">↑</div><div class="t">上传已签署文件</div><div class="h">下载后线下签署，再回传此处</div></div>
    <button class="btn btn-dark" style="width:100%;margin-top:14px" onclick="doSubmitSigned()">提交签署文件</button>`;
}
function doSubmitSigned(){O.agreement_status="reviewing";render();}

function showDelivery(p){
  p=p||document.getElementById("panel");
  if(O.payment_status!=="paid"||!["ready","downloaded"].includes(O.delivery_status)){
    // 锁定预览
    p.innerHTML=`<div class="pt">交付文件（未解锁）</div>
      <div class="note">付款成功后自动解锁正式交付文件。当前仅可确认所购花型。</div>
      <div class="locks">${[1,2,3].map(()=>`<div class="lockcell"><div class="ov"><div><div class="l">🔒</div><div class="tx">付款后解锁</div></div></div></div>`).join("")}</div>`;
    return;
  }
  p.innerHTML=`<div class="pt">交付文件</div>
    ${["缠枝莲团花.psd|82 MB","缠枝莲团花.tiff|140 MB","授权书.pdf|1.2 MB"].map(f=>{const[n,s]=f.split("|");
      return `<div class="delivery-file"><div><div class="n">${n}</div><div class="s">${s} · 版本 v1</div></div><button class="btn btn-line" onclick="doDownload()">下载</button></div>`}).join("")}
    <div class="note">下载链接有效期 30 分钟，每次下载均记录下载人与时间。退款/冻结后停止发放新链接。</div>`;
}
function doDownload(){if(O.delivery_status==="ready")O.delivery_status="downloaded";render();alert("TEST：已生成 30 分钟短期下载链接（占位）");}

function showRecord(){document.getElementById("panel").innerHTML=`<div class="pt">订单记录</div>
  <div class="field"><span>签约</span><span class="v">已签署</span></div>
  <div class="field"><span>支付</span><span class="v">已支付 ¥1,000.00</span></div>
  <div class="field"><span>交付</span><span class="v">${LABELS.delivery[O.delivery_status]}</span></div>
  <div class="note">授权信息、下载记录与售后入口均在此查看。</div>`;}

// ====== 员工视角：签约/交付准备控制台 ======
function renderStaff(p){
  let html=`<div class="pt">员工操作台</div>`;
  if(O.agreement_status==="no_agreement"){
    html+=`<div class="drop" onclick="staff('upload')"><div class="up">↑</div><div class="t">上传合同 / 协议</div><div class="h">PDF / Word / DOCX</div></div>`;
  }else if(O.agreement_status==="agreement_uploaded"){
    html+=`<div class="field"><span>合同</span><span class="v">KiNG_授权协议.pdf</span></div>
      <button class="btn btn-dark" style="width:100%;margin-top:14px" onclick="staff('initiate')">发起签约</button>`;
  }else if(O.agreement_status==="awaiting_signature"){
    html+=`<div class="hintbox">已发起签约，等待客户下载、签署并回传。</div>`;
  }else if(O.agreement_status==="reviewing"||O.agreement_status==="signed_returned"){
    html+=`<div class="field"><span>客户回传</span><span class="v">已签署文件.pdf</span></div>
      <div class="btnrow"><button class="btn btn-ok" onclick="staff('approve')">审核通过</button><button class="btn btn-err" onclick="staff('reject')">驳回</button></div>`;
  }else if(O.agreement_status==="rejected"){
    html+=`<div class="hintbox" style="color:var(--err)">已驳回，等待客户重新上传。</div>`;
  }else if(O.agreement_status==="signed"){
    if(["not_ready","preparing"].includes(O.delivery_status)){
      html+=`<div class="hintbox">签署已生效。上传交付文件后进入「已准备待付款」锁定态，付款成功自动解锁。</div>
        <div class="drop" onclick="staff('prepare')"><div class="up">↑</div><div class="t">上传并准备交付</div><div class="h">PSD / TIFF / AI / 授权书</div></div>`;
    }else if(O.delivery_status==="prepared_locked"){
      html+=`<div class="hintbox">交付已准备（锁定）。等待客户付款后自动解锁为「可下载」。</div>`;
    }else if(["ready","downloaded"].includes(O.delivery_status)){
      html+=`<div class="field"><span>交付</span><span class="v">${LABELS.delivery[O.delivery_status]}</span></div>`;
      if(O.delivery_status==="downloaded"&&O.order_status!=="completed")
        html+=`<button class="btn btn-dark" style="width:100%;margin-top:14px" onclick="staff('complete')">标记订单完成</button>`;
    }
  }
  // 付款模拟（员工侧仅 TEST：真实由回调/查单驱动）
  if(O.agreement_status==="signed"&&O.payment_status!=="paid")
    html+=`<div class="note">（TEST）付款由客户在支付页完成；此处可模拟：<a class="lnk" onclick="staff('paid')">模拟付款成功</a></div>`;
  p.innerHTML=html;
}
function staff(a){
  if(a==="upload")O.agreement_status="agreement_uploaded";
  else if(a==="initiate")O.agreement_status="awaiting_signature";
  else if(a==="approve"){O.agreement_status="signed";O.order_status="active";}
  else if(a==="reject")O.agreement_status="rejected";
  else if(a==="prepare")O.delivery_status="prepared_locked";
  else if(a==="paid"){O.payment_status="paid";if(O.delivery_status==="prepared_locked")O.delivery_status="ready";}
  else if(a==="complete")O.order_status="completed";
  render();
}

document.getElementById("roleToggle").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-role]");if(!btn)return;
  role=btn.dataset.role;document.querySelectorAll("#roleToggle button").forEach(x=>x.classList.toggle("on",x===btn));
  render();
});
render();
</script>
</body>
</html>
